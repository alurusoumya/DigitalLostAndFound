<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Notifications</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark px-4" style="background:#0F4C81;">

<h3 class="text-white">
Notifications
</h3>

<a href="/user-dashboard" class="btn btn-light">
Dashboard
</a>

</nav>

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-primary mb-4">
My Notifications
</h2>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Message</th>

<th>Date</th>

<th>Status</th>

</tr>

</thead>

<tbody>

<tr th:each="n : ${notifications}">

<td th:text="${n.notificationId}"></td>

<td th:text="${n.message}"></td>

<td th:text="${n.notificationDate}"></td>

<td>

<span class="badge bg-success"
th:if="${n.status=='Read'}">
Read
</span>

<span class="badge bg-warning"
th:if="${n.status=='Unread'}">
Unread
</span>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</body>

</html>
