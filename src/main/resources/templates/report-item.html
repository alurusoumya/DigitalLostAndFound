<!DOCTYPE html>
<html>
<head>
    <title>Report Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark px-4" style="background:#0F4C81;">
    <h3 class="text-white">Report Lost / Found Item</h3>
    <a href="/items" class="btn btn-light">View Items</a>
</nav>

<div class="container mt-5">
    <div class="card p-4 shadow" style="border-radius:18px;">
        <h3 class="mb-4 text-center" style="color:#0F4C81;">Item Details</h3>

        <form action="/save-item" method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input type="text" name="itemName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-control" required>
                    <option value="">Select Category</option>
                    <option>Electronics</option>
                    <option>Wallet</option>
                    <option>ID Card</option>
                    <option>Books</option>
                    <option>Bag</option>
                    <option>Keys</option>
                    <option>Others</option>
                </select>
            </div>
            
            <div class="mb-3">
               <label class="form-label">Brand</label>
               <input type="text"
                      name="itemBrand"
                      class="form-control"
                      placeholder="Example: Dell, Samsung, Wildcraft">
            </div>

            <div class="mb-3">
                <label class="form-label">Color</label>
                <input type="text"
                       name="itemColor"
                       class="form-control"
                       placeholder="Example: Black, Blue, Brown">
            </div> 
            
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="locationFound" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-control" required>
                    <option value="">Select Status</option>
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Item Image</label>
                <input type="file" name="imageFile" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-success w-100">Submit Item</button>
        </form>
    </div>
</div>

</body>
</html>
