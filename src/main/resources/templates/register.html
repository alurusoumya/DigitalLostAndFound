<!DOCTYPE html>
<html>
<head>
    <title>Register - Digital Lost and Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1ABC9C, #0F4C81);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            width: 460px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }
        .title {
            color: #0F4C81;
            font-weight: 700;
        }
        .btn-custom {
            background: #1ABC9C;
            color: white;
            border-radius: 30px;
        }
        .btn-custom:hover {
            background: #159a80;
            color: white;
        }
        a {
            color: #0F4C81;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card p-4">
    <div class="text-center mb-4">
        <h2 class="title">Create Account</h2>
        <p class="text-muted">Join Digital Lost & Found Portal</p>
    </div>

    <form action="/register" method="post">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName" class="form-control" placeholder="Enter full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Create password" required>
        </div>

        <button type="submit" class="btn btn-custom w-100 mt-2">Register</button>
    </form>

    <p class="text-center mt-3">
        Already registered? <a href="/">Login here</a>
    </p>
</div>

</body>
</html>
