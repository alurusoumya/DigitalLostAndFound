<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>View Items</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}

.navbar{
    background:#0F4C81;
}

.card{
    border:none;
    border-radius:18px;
}

img{
    object-fit:cover;
    border-radius:10px;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark px-4">

    <h3 class="text-white">Digital Lost & Found Portal</h3>

    <a href="/user-dashboard" class="btn btn-light">
        Dashboard
    </a>

</nav>

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="mb-4 text-primary">
All Lost & Found Items
</h2>

<div class="row mb-4">

    <div class="col-md-4">

        <form action="/search">

            <input
                type="text"
                name="keyword"
                class="form-control"
                placeholder="Search Item">

        </form>

    </div>

    <div class="col-md-3">

        <form action="/filter-category">

            <select
                name="category"
                class="form-control"
                onchange="this.form.submit()">

                <option value="">Category</option>
                <option>Electronics</option>
                <option>Wallet</option>
                <option>Bag</option>
                <option>ID Card</option>
                <option>Books</option>
                <option>Keys</option>
                <option>Others</option>

            </select>

        </form>

    </div>

    <div class="col-md-3">

        <form action="/filter-status">

            <select
                name="status"
                class="form-control"
                onchange="this.form.submit()">

                <option value="">Status</option>
                <option>Lost</option>
                <option>Found</option>

            </select>

        </form>

    </div>

    <div class="col-md-2">

        <a href="/items"
           class="btn btn-secondary w-100">
            Reset
        </a>

    </div>

</div>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Image</th>
<th>Item Name</th>
<th>Category</th>
<th>Brand</th>
<th>Color</th>
<th>Description</th>
<th>Location</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="item : ${items}">

<td th:text="${item.itemId}"></td>

<td>

<img
    th:if="${item.imagePath != null}"
    th:src="@{'/uploads/' + ${item.imagePath}}"
    width="90"
    height="90"
    style="object-fit:cover;border-radius:10px;">

</td>

<td th:text="${item.itemName}"></td>

<td th:text="${item.category}"></td>

<td th:text="${item.itemBrand}"></td>

<td th:text="${item.itemColor}"></td>

<td th:text="${item.description}"></td>

<td th:text="${item.locationFound}"></td>

<td th:text="${item.dateFound}"></td>

<td>

<span
class="badge bg-danger"
th:if="${item.status=='Lost'}">

Lost

</span>

<span
class="badge bg-success"
th:if="${item.status=='Found'}">

Found

</span>

</td>

<td>

<a
th:if="${item.status=='Found'}"
th:href="@{/claim-item/{itemId}(itemId=${item.itemId})}"
class="btn btn-warning btn-sm">

Claim

</a>

<span
th:if="${item.status=='Lost'}"
class="badge bg-secondary">

Reported Lost

</span>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</body>

</html>
