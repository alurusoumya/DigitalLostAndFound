<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Manage Claims</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #f4f6f9;
}

.navbar {
    background: #0F4C81;
}

.card {
    border: none;
    border-radius: 18px;
}

.table td {
    vertical-align: middle;
}

.action-buttons {
    display: flex;
    gap: 8px;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark px-4">
    <h3 class="text-white">Manage Claims</h3>
    <a href="/admin-dashboard" class="btn btn-light">Dashboard</a>
</nav>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-primary mb-4">All Claims</h2>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Claim ID</th>
                    <th>Item ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="claim : ${claims}">
                    <td th:text="${claim.claimId}"></td>
                    <td th:text="${claim.itemId}"></td>
                    <td th:text="${claim.claimantName}"></td>
                    <td th:text="${claim.claimantEmail}"></td>
                    <td th:text="${claim.claimantPhone}"></td>
                    <td th:text="${claim.claimDate}"></td>

                    <td>
                        <span class="badge bg-warning text-dark"
                              th:if="${claim.claimStatus == 'Pending'}">
                            Pending
                        </span>

                        <span class="badge bg-success"
                              th:if="${claim.claimStatus == 'Approved'}">
                            Approved
                        </span>

                        <span class="badge bg-danger"
                              th:if="${claim.claimStatus == 'Rejected'}">
                            Rejected
                        </span>
                    </td>

                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/approve-claim/{id}(id=${claim.claimId})}"
                               class="btn btn-success btn-sm">
                                Approve
                            </a>

                            <a th:href="@{/reject-claim/{id}(id=${claim.claimId})}"
                               class="btn btn-danger btn-sm">
                                Reject
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
