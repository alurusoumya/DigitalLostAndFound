<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background:#f4f6f9;
}
.navbar {
    background:#0F4C81;
}
.card {
    border:none;
    border-radius:18px;
    transition:0.3s;
}
.card:hover {
    transform:translateY(-5px);
}
</style>
</head>

<body>

<nav class="navbar navbar-dark px-4">
    <h3 class="text-white">Digital Lost & Found Portal - Admin</h3>
    <a href="/logout" class="btn btn-light">Logout</a>
</nav>

<div class="container mt-5">

<h2 class="mb-4">Welcome Admin 👋</h2>

<div class="row g-4">
    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>Total Users</h5>
            <h2 th:text="${totalUsers}"></h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>Total Items</h5>
            <h2 th:text="${totalItems}"></h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>Total Claims</h5>
            <h2 th:text="${totalClaims}"></h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>Portal Status</h5>
            <h4 class="text-success">Running</h4>
        </div>
    </div>
</div>

<hr class="my-5">

<div class="row g-4">
    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>Manage Items</h5>
            <a href="/admin-items" class="btn btn-success mt-3">Open</a>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>Manage Claims</h5>
            <a href="/admin-claims" class="btn btn-warning mt-3">Open</a>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>User Feedback</h5>
            <a href="/admin-feedback" class="btn btn-info mt-3">Open</a>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow p-4 text-center">
            <h5>Manage Users</h5>
            <a href="/admin-users" class="btn btn-primary mt-3">Open</a>
        </div>
    </div>
</div>

</div>

</body>
</html>
