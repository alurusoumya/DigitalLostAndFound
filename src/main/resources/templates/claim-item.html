<!DOCTYPE html>
<html>
<head>
    <title>Claim Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark px-4" style="background:#0F4C81;">
    <h3 class="text-white">Claim Item</h3>
    <a href="/items" class="btn btn-light">Back</a>
</nav>

<div class="container mt-5">
    <div class="card p-4 shadow" style="border-radius:18px;">
        <h3 class="mb-4 text-center" style="color:#0F4C81;">Submit Claim Request</h3>

        <form action="/submit-claim" method="post">
            <input type="hidden" name="itemId" th:value="${itemId}">

            <div class="mb-3">
                <label class="form-label">Your Name</label>
                <input type="text" name="claimantName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Your Email</label>
                <input type="email" name="claimantEmail" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Your Phone</label>
                <input type="text" name="claimantPhone" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-warning w-100">Submit Claim</button>
        </form>
    </div>
</div>

</body>
</html>
