<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark px-4" style="background:#0F4C81;">
    <h3 class="text-white">User Feedback</h3>
    <a href="/admin-dashboard" class="btn btn-light">Dashboard</a>
</nav>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-primary mb-4">All Feedback</h2>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>User ID</th>
                    <th>Message</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="f : ${feedbacks}">
                    <td th:text="${f.feedbackId}"></td>
                    <td th:text="${f.userId}"></td>
                    <td th:text="${f.message}"></td>
                    <td th:text="${f.feedbackDate}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
