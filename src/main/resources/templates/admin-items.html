<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Admin Items</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark px-4" style="background:#0F4C81;">
    <h3 class="text-white">Manage Items</h3>
    <a href="/admin-dashboard" class="btn btn-light">Dashboard</a>
</nav>

<div class="container mt-5">
<div class="card shadow p-4">
<h2 class="text-primary mb-4">All Reported Items</h2>

<table class="table table-bordered table-hover">
<thead class="table-dark">
<tr>
    <th>ID</th>
    <th>Image</th>
    <th>Item Name</th>
    <th>Category</th>
    <th>Brand</th>
    <th>Color</th>
    <th>Location</th>
    <th>Date</th>
    <th>Status</th>
</tr>
</thead>

<tbody>
<tr th:each="item : ${items}">
    <td th:text="${item.itemId}"></td>

    <td>
        <img th:if="${item.imagePath != null}"
             th:src="@{'/uploads/' + ${item.imagePath}}"
             width="80"
             height="80"
             style="object-fit:cover; border-radius:10px;">
    </td>

    <td th:text="${item.itemName}"></td>
    <td th:text="${item.category}"></td>
    <td th:text="${item.itemBrand}"></td>
    <td th:text="${item.itemColor}"></td>
    <td th:text="${item.locationFound}"></td>
    <td th:text="${item.dateFound}"></td>

    <td>
        <span class="badge bg-danger" th:if="${item.status == 'Lost'}">Lost</span>
        <span class="badge bg-success" th:if="${item.status == 'Found'}">Found</span>
    </td>
</tr>
</tbody>
</table>

</div>
</div>

</body>
</html>
