<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark px-4" style="background:#0F4C81;">
    <h3 class="text-white">Feedback</h3>
    <a href="/user-dashboard" class="btn btn-light">Dashboard</a>
</nav>

<div class="container mt-5">
    <div class="card shadow p-4" style="border-radius:18px;">
        <h2 class="text-primary mb-4">Share Your Feedback</h2>

        <form action="/submit-feedback" method="post">
            <div class="mb-3">
                <label class="form-label">Your Feedback</label>
                <textarea name="message" class="form-control" rows="5" required></textarea>
            </div>

            <button class="btn btn-success w-100">Submit Feedback</button>
        </form>
    </div>
</div>

</body>
</html>
