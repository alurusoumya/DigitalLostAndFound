<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Claims</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark px-4" style="background:#0F4C81;">
    <h3 class="text-white">My Claims</h3>
    <a href="/user-dashboard" class="btn btn-light">Dashboard</a>
</nav>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-primary mb-4">Submitted Claims</h2>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Claim ID</th>
                    <th>Item ID</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="claim : ${claims}">
                    <td th:text="${claim.claimId}"></td>
                    <td th:text="${claim.itemId}"></td>
                    <td th:text="${claim.claimDate}"></td>
                    <td>
                        <span class="badge bg-warning" th:if="${claim.claimStatus=='Pending'}">Pending</span>
                        <span class="badge bg-success" th:if="${claim.claimStatus=='Approved'}">Approved</span>
                        <span class="badge bg-danger" th:if="${claim.claimStatus=='Rejected'}">Rejected</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
